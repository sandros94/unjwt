landing:
  heroLinks:
    primary:
      label: "Get Started"
      icon: "i-lucide-rocket"
      to: "/getting-started"
    playOnline:
      label: "Try Online"
      icon: "i-simple-icons-stackblitz"
      to: "https://stackblitz.com/github/sandros94/unjwt/tree/main/examples/try-online?file=server.mjs"
  heroCode:
    lang: "ts"
    title: "app.ts"
    content: |
      // Sign with the private half, verify with the public one
      import { sign, verify } from "unjwt/jws";
      import { generateJWK } from "unjwt/jwk";

      const { privateKey, publicKey } = await generateJWK("ES256");
      const token = await sign({ sub: "user_1a2b" }, privateKey, { expiresIn: "15m" });
      const { payload } = await verify(token, publicKey);

      // Keep a session in a cookie, on any Web Request
      import { defineJWESession } from "unjwt/session";

      const appSession = defineJWESession({ key: await generateJWK("A256GCM"), maxAge: "7D" });
      const session = await appSession.use({ req: request, res: { headers } });
      await session.update({ user: "user_1a2b" });
  contributors: false
  features:
    - title: "Web Crypto, zero dependencies"
      description: "Built on the [Web Crypto API](https://developer.mozilla.org/en-US/docs/Web/API/Web_Crypto_API). No runtime dependencies, no Node built-ins: the same code runs in Node.js, Bun, Deno, Workers and browsers."
      icon: "i-lucide-lock"
    - title: "JWS, JWE and JWK in one package"
      description: "Signing ([RFC 7515](https://www.rfc-editor.org/rfc/rfc7515)), encryption ([RFC 7516](https://www.rfc-editor.org/rfc/rfc7516)) and keys ([RFC 7517](https://www.rfc-editor.org/rfc/rfc7517)), compact and JSON serializations, plus [DPoP](https://www.rfc-editor.org/rfc/rfc9449) proofs."
      icon: "i-lucide-layers"
    - title: "Keys pick the algorithm"
      description: "Pass a JWK and the algorithm comes from the key, on both sides. Key pairs, JWK Sets with rotation, PEM import and thumbprints as key IDs."
      icon: "i-lucide-key-round"
    - title: "Sessions on any Web runtime"
      description: "Signed or encrypted cookie sessions over a Web `Request`: h3, Nitro, Nuxt, Hono, Workers, Bun and Deno, and a driver for any other framework."
      icon: "i-lucide-cookie"
    - title: "One error, one code"
      description: "Every failure, a bad token or a setup mistake, throws a `JWTError` with a `code` you can branch on. Nothing returns a half-checked result."
      icon: "i-lucide-triangle-alert"
    - title: "Limits that fail closed"
      description: "Every call that reads a token bounds its work: signatures, recipients, key trials and PBES2 iterations. Past a limit the token is refused."
      icon: "i-lucide-shield-check"
