# yaml-language-server: $schema=https://unpkg.com/undocs/schema/config.json
name: unjwt
url: https://unjwt.s94.dev
shortDescription: Low-level JWT toolkit on the Web Crypto API
description: Sign, verify, encrypt and decrypt JSON Web Tokens with Web Crypto. JWS, JWE and JWK in one zero-dependency package, with cookie sessions for h3, Nitro, Nuxt, Elysia and any Web standard runtime.

lang: en
automd: true
themeColor: mono
github: sandros94/unjwt

redirects:
  /guide: /getting-started
  /blog: /
  /getting-started/core-concepts: /getting-started/concepts
  /jwt/jws/signing: /jwt/jws/sign
  /jwt/jws/verifying: /jwt/jws/verify
  /jwt/jws/multi-signature: /jwt/jws/multi
  /jwt/jwe/encrypting: /jwt/jwe/encrypt
  /jwt/jwe/decrypting: /jwt/jwe/decrypt
  /jwt/jwe/multi-recipient: /jwt/jwe/multi
  /jwt/jwe/ecdh-es: /jwt/jwe/algorithms
  /jwk/generating: /jwk/generate
  /jwk/wrapping: /jwk/wrap-unwrap
  /jwk/password-derivation: /jwk/password
  /jwk/jwk-sets: /jwk/sets
  /utilities: /utils
  /adapters: /frameworks
  /adapters/h3: /frameworks/adapters
  /adapters/h3/lower-level: /frameworks/definition
  /adapters/h3-sessions: /frameworks/adapters
  /adapters/elysia: /frameworks/elysia
  /adapters/elysia/lower-level: /frameworks/elysia/lower-level
  /adapters/elysia-sessions: /frameworks/elysia
  /adapters/session: /frameworks/session
  /adapters/hooks: /frameworks/hooks
  /adapters/drivers: /frameworks/drivers
  /adapters/lower-level: /frameworks/definition
  /frameworks/adapters/lower-level: /frameworks/definition

socials:
  bluesky: "https://bsky.app/profile/sandros94.com"

landing:
  heroLinks:
    primary:
      label: "Get Started"
      icon: "i-lucide-rocket"
      to: "/getting-started"
    playOnline:
      label: "Try Online"
      icon: "i-simple-icons-stackblitz"
      to: "https://stackblitz.com/github/sandros94/unjwt/tree/main/example?file=server.mjs"
  heroCode:
    lang: "ts"
    title: "app.ts"
    content: |
      // Sign a JWT (JWS)
      import { sign, verify } from "unjwt/jws";
      import { generateJWK } from "unjwt/jwk";

      const key = await generateJWK("HS256");
      const token = await sign({ sub: "user_1" }, key, { expiresIn: "1h" });
      const { payload } = await verify(token, key);

      // Encrypt a JWT (JWE)
      import { encrypt, decrypt } from "unjwt/jwe";

      const jwe = await encrypt({ secret: "data" }, "my-password");
      const { payload: p } = await decrypt(jwe, "my-password");
  contributors: false
  features:
    - title: "Web Crypto, zero dependencies"
      description: "Built on the [Web Crypto API](https://developer.mozilla.org/en-US/docs/Web/API/Web_Crypto_API). No Node built-ins, no runtime dependencies. Install once, run in Node, Bun, Deno, Workers and browsers."
      icon: "i-lucide-lock"
    - title: "JWS, JWE and JWK under one roof"
      description: "Signing ([RFC 7515](https://www.rfc-editor.org/rfc/rfc7515)), encryption ([RFC 7516](https://www.rfc-editor.org/rfc/rfc7516)) and key management ([RFC 7517](https://www.rfc-editor.org/rfc/rfc7517)) in one package, compact and JSON serialisations alike."
      icon: "i-lucide-layers"
    - title: "Keys first, algorithms inferred"
      description: "Pass a JWK and the algorithm comes from the key. Import CryptoKeys, JWKs, PEM and raw bytes through one function. Thumbprints as default key ids."
      icon: "i-lucide-key-round"
    - title: "Sessions for H3 and Elysia"
      description: "Cookie-based JWT sessions with chunking, hooks and one typed error. The same session core behind every adapter."
      icon: "i-lucide-cookie"
